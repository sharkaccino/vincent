name: Issue Organization
on: 
  issues:
    types:
      - opened

jobs:
  assign-label-and-project:
    runs-on: codeberg-tiny
    defaults:
      run:
        shell: bash
    outputs:
      date:
    steps:
      - name: Get ISO Date
        id: date
        run: echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $FORGEJO_OUTPUT
      - name: Add Triage Label
        if: forgejo.event.issue.labels[0] == null # skip if issue already has labels
        run: |
          curl -X 'POST' \
          '${{ env.FORGEJO_API_URL }}/repos/${{ env.FORGEJO_REPOSITORY }}/issues/${{ forgejo.event.issue.number }}/labels' \
          -H 'Authorization: token ${{ env.FORGEJO_TOKEN }}' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -d '{
            "labels": [
              "needs triage"
            ],
            "updated_at": "${{ steps.date.outputs.DATE }}"
          }'
