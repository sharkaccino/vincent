name: issue api test

on:
  issues:
    types:
      - opened

jobs:
  test:
    defaults:
      run:
        shell: bash
    runs-on: codeberg-tiny
    steps:
      - name: api url
        run: echo ${{ env.FORGEJO_API_URL }}
      
      - name: repository
        run: echo ${{ env.FORGEJO_REPOSITORY }}
      
      - name: event json
        run: echo ${{ toJSON(forgejo.event) }}
